# DVC Pipeline Configuration

stages:
  prepare:
    cmd: >
      python training/classification/scripts/prepare.py
      --data-dir training/classification/datasets/tomato
      --output training/classification/outputs/data_summary.json
    deps:
      - training/classification/datasets/tomato
      - training/classification/scripts/prepare.py
    outs:
      - training/classification/outputs/data_summary.json

  train:
    cmd: >
      python -m training.classification.train
      training/classification/configs/multiclass/model_large.yaml
      --epochs 10
      --batch-size 16
      --experiment-name tomato-disease-classification
    deps:
      - training/classification/datasets/tomato
      - training/classification/src/
      - training/classification/configs/multiclass/model_large.yaml
      - training/classification/outputs/data_summary.json
    outs:
      - training/models/tomato_large/:
          persist: true
    params:
      - training/classification/configs/multiclass/model_large.yaml:
          - seed
          - model
          - optim

  evaluate:
    cmd: >
      python training/classification/scripts/evaluate.py
      --model-dir training/models/tomato_large
      --test-dir training/classification/datasets/tomato/test
      --output training/classification/outputs/metrics.json
      --image-size 224
    deps:
      - training/models/tomato_large/
      - training/classification/datasets/tomato/test
      - training/classification/scripts/evaluate.py
    metrics:
      - training/classification/outputs/metrics.json:
          cache: false

