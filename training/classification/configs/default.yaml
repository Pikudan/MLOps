seed: 42

data:
  dataset: fake  # fake dataset useful for quick experiments
  image_size: 128
  num_classes: 3
  augmentations:
    horizontal_flip: true
    rotation: 10
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

model:
  architecture: simple_cnn
  in_channels: 3
  hidden_dim: 32
  num_classes: 3
  dropout: 0.25

optim:
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 3
  batch_size: 16
  device: cpu

logging:
  level: INFO
  log_dir: training/logs
  log_to_file: true

save:
  output_dir: training/models/latest
  save_best: true

