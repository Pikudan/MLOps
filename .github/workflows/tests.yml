name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r training/classification/requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=${{ github.workspace }}/training:${{ github.workspace }}/training/classification/src pytest training/classification/tests --maxfail=1 --disable-warnings -q

      - name: YOLO config dry run
        run: |
          python training/detection/yolo/scripts/train_yolo.py training/detection/yolo/configs/tomato_detect.yaml --dry-run --device cpu

  mlops:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MLOps dependencies
        run: |
          pip install --upgrade pip
          pip install dvc dvc-s3 mlflow pandas pillow pyyaml
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install torchserve torch-model-archiver

      # ===== DVC =====
      - name: Verify DVC configuration
        run: |
          echo "=== DVC Version ==="
          dvc version
          echo ""
          echo "=== DVC Remote Config ==="
          dvc remote list
          echo ""
          echo "=== DVC Remote Default ==="
          dvc remote default || echo "No default remote set"

      - name: DVC Pull (dry-run)
        run: |
          echo "=== DVC Files ==="
          find . -name "*.dvc" -type f | head -10
          echo ""
          echo "=== DVC Pipeline ==="
          cat dvc.yaml || echo "No dvc.yaml found"

      # ===== MLflow =====
      - name: Verify MLflow integration
        run: |
          echo "=== MLflow Version ==="
          python -c "import mlflow; print(f'MLflow: {mlflow.__version__}')"
          echo ""
          echo "=== Check MLflow in train.py ==="
          grep -n "mlflow" training/classification/train.py | head -10
          echo ""
          echo "=== Check MLflow in trainer.py ==="
          grep -n "mlflow" training/classification/src/trainer.py | head -5

      - name: MLflow functionality test
        run: |
          python -c "
          import mlflow
          import os
          import tempfile
          
          # Test creating experiment
          mlflow.set_experiment('ci-test-experiment')
          print('✅ Experiment created')
          
          # Test logging
          with mlflow.start_run():
              mlflow.log_param('test_param', 'test_value')
              mlflow.log_metric('test_metric', 0.95)
              print('✅ Parameters and metrics logged')
              
              # Test artifact logging
              with tempfile.NamedTemporaryFile(mode='w', delete=False, suffix='.txt') as f:
                  f.write('test artifact')
                  temp_path = f.name
              
              mlflow.log_artifact(temp_path)
              print('✅ Artifact logged')
              os.unlink(temp_path)
          
          print('✅ MLflow functionality test passed')
          "

      # ===== Docker =====
      - name: Verify Dockerfile
        run: |
          echo "=== Dockerfile exists ==="
          ls -la Dockerfile
          echo ""
          echo "=== Dockerfile content ==="
          head -30 Dockerfile

      - name: Docker build (offline inference)
        run: |
          docker build -t tomato-inference:ci .
        continue-on-error: true

      # ===== Predict.py =====
      - name: Verify predict.py
        run: |
          echo "=== predict.py exists ==="
          ls -la src/predict.py
          echo ""
          echo "=== predict.py --help ==="
          PYTHONPATH=${{ github.workspace }} python -m src.predict --help || echo "predict.py check failed (model not available)"

      # ===== TorchServe =====
      - name: Verify TorchServe files
        run: |
          echo "=== TorchServe directory ==="
          ls -la torchserve/
          echo ""
          echo "=== Handler exists ==="
          ls -la torchserve/handler.py
          echo ""
          echo "=== Export script exists ==="
          ls -la torchserve/export_model.py
          echo ""
          echo "=== Config exists ==="
          cat torchserve/config.properties

      - name: Verify TorchServe handler syntax
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          import ast
          with open('torchserve/handler.py', 'r') as f:
              ast.parse(f.read())
          print('handler.py syntax OK')
          "

      - name: TorchServe handler import test
        run: |
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          
          # Check handler can be parsed and basic structure exists
          with open('torchserve/handler.py', 'r') as f:
              code = f.read()
          
          # Verify handler class exists
          assert 'class TomatoDiseaseHandler' in code, 'Handler class not found'
          assert 'def initialize' in code, 'initialize method not found'
          assert 'def preprocess' in code, 'preprocess method not found'
          assert 'def inference' in code, 'inference method not found'
          assert 'def postprocess' in code, 'postprocess method not found'
          
          print('✅ Handler structure verified')
          print('✅ All required methods found')
          "

      - name: TorchServe version and tools check
        run: |
          echo "=== TorchServe version ==="
          torchserve --version || echo "torchserve command not available"
          echo ""
          echo "=== torch-model-archiver version ==="
          torch-model-archiver --help | head -5 || echo "torch-model-archiver not available"
          echo ""
          echo "=== Config validation ==="
          python -c "
          with open('torchserve/config.properties', 'r') as f:
              content = f.read()
          
          # Check required keys
          required_keys = [
              'inference_address',
              'management_address',
              'metrics_address'
          ]
          
          missing = []
          for key in required_keys:
              if f'{key}=' not in content:
                  missing.append(key)
          
          if missing:
              raise ValueError(f'Missing required keys: {missing}')
          
          print('✅ Config file is valid')
          # Extract values manually
          for line in content.split('\n'):
              if line.startswith('inference_address='):
                  print(f'  Inference address: {line.split(\"=\", 1)[1]}')
              elif line.startswith('management_address='):
                  print(f'  Management address: {line.split(\"=\", 1)[1]}')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: [tests, mlops]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create model directory placeholder
        run: |
          # DVC-tracked directories don't exist in Git
          # Create placeholder for Docker build test
          mkdir -p training/models/tomato
          echo '{"note": "placeholder for CI"}' > training/models/tomato/config.json

      - name: Build Docker image
        run: |
          docker build -t tomato-inference:${{ github.sha }} .
          docker images | grep tomato-inference
