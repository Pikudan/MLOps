name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r training/classification/requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=${{ github.workspace }}/training:${{ github.workspace }}/training/classification/src pytest training/classification/tests --maxfail=1 --disable-warnings -q

      - name: YOLO config dry run
        run: |
          python training/detection/yolo/scripts/train_yolo.py training/detection/yolo/configs/tomato_detect.yaml --dry-run --device cpu

